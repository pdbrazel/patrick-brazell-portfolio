<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrick Brazell | Links</title>
  <meta name="description" content="Operations leader transitioning into business analytics, data, and AI-driven innovation. Quick links to portfolio, LinkedIn, projects, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08080a;
      --bg-elevated: #101014;
      --bg-card: #14141a;
      --bg-card-hover: #1a1a22;
      --border: #2a2a35;
      --border-glow: rgba(255, 90, 31, 0.4);
      --text: #f5f5f7;
      --text-muted: #a8a8b3;
      --text-dim: #6e6e7a;
      --accent: #ff5a1f;
      --accent-bright: #ff7a45;
      --accent-dim: rgba(255, 90, 31, 0.14);
      --accent-glow: rgba(255, 90, 31, 0.45);
      --radius: 16px;
      --font-display: 'Space Grotesk', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none !important;
      opacity: 0.45;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 2.75rem 1.25rem 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Header */
    .avatar-ring {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent) 0%, #ff8a4c 50%, var(--accent) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.35rem;
      box-shadow: 0 0 32px var(--accent-glow);
      animation: fadeUp 0.6s ease both;
    }

    .avatar-inner {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 1.55rem;
      letter-spacing: -0.03em;
      color: var(--text);
    }

    .avatar-inner span { color: var(--accent); }

    h1 {
      font-family: var(--font-display);
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin-bottom: 0.35rem;
      animation: fadeUp 0.6s 0.06s ease both;
    }

    .tagline {
      font-family: var(--font-display);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    .tagline .plus { color: var(--accent); margin: 0 0.12rem; }

    .story {
      font-family: var(--font-display);
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 1rem;
      animation: fadeUp 0.6s 0.14s ease both;
    }

    .desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      max-width: 22rem;
      margin-bottom: 1.85rem;
      line-height: 1.55;
      animation: fadeUp 0.6s 0.18s ease both;
    }

    /* Buttons */
    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      animation: fadeUp 0.6s 0.24s ease both;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      min-height: 56px;
      padding: 0.9rem 1.25rem;
      border-radius: 14px;
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--bg-card);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .link-btn:active {
      transform: scale(0.98);
    }

    .link-btn:hover,
    .link-btn:focus-visible {
      border-color: var(--border-glow);
      background: var(--bg-card-hover);
      box-shadow: 0 6px 24px rgba(0,0,0,0.35), 0 0 20px rgba(255,90,31,0.08);
      transform: translateY(-2px);
      outline: none;
    }

    .link-btn.primary {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 0 28px var(--accent-glow);
    }

    .link-btn.primary:hover,
    .link-btn.primary:focus-visible {
      background: var(--accent-bright);
      box-shadow: 0 4px 32px var(--accent-glow);
      border-color: transparent;
    }

    .link-btn.linkedin {
      background: #0a66c2;
      border-color: transparent;
      color: #fff;
      box-shadow: 0 0 20px rgba(10, 102, 194, 0.3);
    }

    .link-btn.linkedin:hover,
    .link-btn.linkedin:focus-visible {
      background: #0c7cd5;
      box-shadow: 0 4px 28px rgba(10, 102, 194, 0.45);
      border-color: transparent;
    }

    .link-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Footer */
    .footer {
      margin-top: 2.25rem;
      font-size: 0.78rem;
      color: var(--text-dim);
      animation: fadeUp 0.6s 0.3s ease both;
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer a:hover { color: var(--accent); }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Slightly larger on wider phones / tablets */
    @media (min-width: 480px) {
      .page { padding: 3.25rem 1.5rem 2.75rem; }
      h1 { font-size: 2.05rem; }
      .link-btn { min-height: 58px; font-size: 1.02rem; }
    }
  </style>
</head>
<body>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <main class="page">
    <div class="avatar-ring" aria-hidden="true">
      <div class="avatar-inner">P<span>B</span></div>
    </div>

    <h1>PATRICK BRAZELL</h1>
    <p class="tagline">Business <span class="plus">+</span> Data <span class="plus">+</span> AI</p>
    <p class="story">From the warehouse floor to intelligent systems.</p>
    <p class="desc">Operations leader transitioning into business analytics, data, and AI-driven innovation.</p>

    <nav class="links" aria-label="Quick links">
      <a class="link-btn primary" href="https://pdbrazel.github.io/patrick-brazell-portfolio/">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        View My Portfolio
      </a>

      <a class="link-btn linkedin" href="https://www.linkedin.com/in/patrick-brazell-06b180134/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
        LinkedIn
      </a>

      <a class="link-btn" href="mailto:patrickbrazell555@gmail.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>

      </a>

      <a class="link-btn" href="https://pdbrazel.github.io/patrick-brazell-portfolio/#projects">

        Projects

      <a class="link-btn" href="https://pdbrazel.github.io/patrick-brazell-portfolio/#experience">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
        Experience

      <a class="link-btn" href="https://pdbrazel.github.io/patrick-brazell-portfolio/#education">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        Education &amp; Certifications
      </a>
    </nav>

    <p class="footer">
      <a href="https://pdbrazel.github.io/patrick-brazell-portfolio/">patrick-brazell-portfolio</a>
    </p>
  </main>

  <script>
    (function () {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      const LABELS = [
        'AI', 'DATA', 'ANALYTICS', 'POWER BI', 'SQL', 'EXCEL',
        'AUTOMATION', 'BUSINESS', 'LOGISTICS', 'MACHINE LEARNING',
        'OPTIMIZATION', 'DASHBOARDS'
      ];
      const nodes = [];
      const NODE_COUNT = 18; // lighter for mobile performance
      const ACCENT = { r: 255, g: 90, b: 31 };

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      function createNodes() {
        nodes.length = 0;
        for (let i = 0; i < NODE_COUNT; i++) {
          nodes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.22,
            vy: (Math.random() - 0.5) * 0.22,
            label: LABELS[i % LABELS.length],
            size: Math.random() * 0.35 + 0.6,
            alpha: Math.random() * 0.22 + 0.1
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        // subtle grid
        ctx.strokeStyle = 'rgba(255, 90, 31, 0.025)';
        ctx.lineWidth = 1;
        const g = 64;
        for (let x = 0; x < width; x += g) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
        }
        for (let y = 0; y < height; y += g) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
        }

        // connections
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[i].x - nodes[j].x;
            const dy = nodes[i].y - nodes[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 140) {
              const a = (1 - dist / 140) * 0.15;
              ctx.strokeStyle = `rgba(${ACCENT.r},${ACCENT.g},${ACCENT.b},${a})`;
              ctx.lineWidth = 0.7;
              ctx.beginPath();
              ctx.moveTo(nodes[i].x, nodes[i].y);
              ctx.lineTo(nodes[j].x, nodes[j].y);
              ctx.stroke();
            }
          }
        }

        // nodes + labels
        for (const n of nodes) {
          n.x += n.vx;
          n.y += n.vy;
          if (n.x < 0 || n.x > width) n.vx *= -1;
          if (n.y < 0 || n.y > height) n.vy *= -1;

          ctx.beginPath();
          ctx.arc(n.x, n.y, 2 * n.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${ACCENT.r},${ACCENT.g},${ACCENT.b},${0.4 * n.size})`;
          ctx.fill();

          ctx.font = `${9.5 * n.size}px Inter, system-ui, sans-serif`;
          ctx.fillStyle = `rgba(${ACCENT.r},${ACCENT.g},${ACCENT.b},${n.alpha})`;
          ctx.textAlign = 'center';
          ctx.fillText(n.label, n.x, n.y - 7 * n.size);
        }

        requestAnimationFrame(draw);
      }

      resize();
      createNodes();
      draw();
      window.addEventListener('resize', () => { resize(); createNodes(); });
    })();
  </script>
</body>
</html>
